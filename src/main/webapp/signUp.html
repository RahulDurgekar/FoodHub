<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — FoodHub</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap {
    min-height: calc(100vh - var(--nav-h));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    box-shadow: 0 30px 60px -30px rgba(var(--shadow-color), 0.4);
  }
  .auth-card h1 { font-size: 1.7rem; }
  .auth-card p.sub { color: var(--color-text-muted); margin-top: 6px; margin-bottom: 28px; font-size: 0.92rem; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    background: var(--color-surface-alt);
    color: var(--color-text);
    outline: none;
    font-size: 0.92rem;
    transition: border-color var(--transition-fast);
  }
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    background: var(--color-surface-alt);
    color: var(--color-text);
    outline: none;
    font-size: 0.92rem;
    transition: border-color var(--transition-fast);
    appearance: none;
    cursor: pointer;
}

.form-group select:focus {
    border-color: var(--color-primary);
}
  .form-group input:focus { border-color: var(--color-primary); }
  .form-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .auth-card .btn { width: 100%; padding: 13px; margin-top: 6px; }
  .auth-switch { text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--color-text-muted); }
  .auth-switch a { color: var(--color-primary); font-weight: 700; }
  .fine-print { font-size: 0.76rem; color: var(--color-text-muted); margin-top: 16px; text-align: center; }
</style>
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">FoodHub<span class="dot">.</span></a>
    <div style="margin-left:auto;">
      <a href="index.html" class="btn btn-ghost btn-sm">Back to home</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Join FoodHub</span>
    <h1>Create your account</h1>
    <p class="sub">Order from 1,200+ restaurants, track deliveries live, and save your favourites.</p>

    <!--
      Point this form at your servlet's registration endpoint, e.g.:
      <form action="/FoodHub/register" method="POST">
      The servlet can read request.getParameter("name") / "email" / "phone" / "password".
    -->
    <form action="signUp" method="POST">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="form-two">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" style="padding-bottom: 60px; vertical-align: top;" placeholder="Your Address">
      </div>
      
      <div class="form-group">
    <label for="role">Role</label>
    <select id="role" name="role" required>
        <option value="" selected disabled>Select your role</option>
        <option value="Customer">Customer</option>
        <option value="Restaurant Admin">Restaurant Admin</option>
        <option value="Delivery Partner">Delivery Partner</option>
        <option value="Admin">Admin</option>
    </select>
	</div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="fine-print">By signing up you agree to FoodHub's Terms and Privacy Policy.</p>
    <p class="auth-switch">Already have an account? <a href="logIn.html">Log in</a></p>
  </div>
</div>

</body>
</html>
